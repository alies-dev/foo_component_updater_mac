name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag against main, src/version.h and CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          SOURCE_VERSION="$(sed -nE 's/^#define[[:space:]]+FCU_VERSION[[:space:]]+"([^"]+)".*/\1/p' src/version.h)"
          [ "$SOURCE_VERSION" = "$VERSION" ] || { echo "::error::Tag is $VERSION but src/version.h has '$SOURCE_VERSION'"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no non-empty '## [$VERSION]' section"; exit 1; }

      - uses: ./.github/actions/build

      - name: Create release
        run: |
          set -euo pipefail
          (cd build && shasum -a 256 foo_component_updater_mac.fb2k-component) > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" build/foo_component_updater_mac.fb2k-component SHA256SUMS \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
